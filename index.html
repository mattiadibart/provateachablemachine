
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prova mostra</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2em;
    }
    h1 {
      font-size: 2em;
    }
    #start-button {
      font-size: 2em;
      padding: 1em 2em;
      margin: 1em 0;
      cursor: pointer;
    }
    #webcam-container canvas {
      width: 100%%;
      max-width: 800px;
      height: auto;
    }
    .label-box {
      margin-top: 1em;
      font-weight: bold;
      font-size: 1.5em;
    }
    .bar {
      height: 25px;
      margin-top: 0.3em;
      border-radius: 5px;
    }
    .lion { background-color: orange; }
    .zebra { background-color: red; }
    .ornitorinco { background-color: purple; }
  </style>
</head>
<body>
  <h1>Prova mostra</h1>
  <button id="start-button" type="button" onclick="init()">Iniziamo</button>
  <div id="webcam-container"></div>
  <div id="label-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/k_LLBp9zI/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        document.getElementById("start-button").style.display = "none";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = false;
        webcam = new tmImage.Webcam(800, 800, flip);
        await webcam.setup({ facingMode: "environment" });
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");

        for (let i = 0; i < maxPredictions; i++) {
            const labelBox = document.createElement("div");
            labelBox.className = "label-box";
            const label = document.createElement("div");
            const bar = document.createElement("div");
            bar.classList.add("bar");

            // Colore barra in base alla classe
            if (i === 0) bar.classList.add("leone", "lion");
            else if (i === 1) bar.classList.add("zebra");
            else if (i === 2) bar.classList.add("ornitorinco");

            bar.style.width = "0%";

            labelBox.appendChild(label);
            labelBox.appendChild(bar);
            labelContainer.appendChild(labelBox);
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const percentage = (prediction[i].probability * 100).toFixed(1);
            const classPrediction = prediction[i].className + ": " + percentage + "%";

            const labelBox = labelContainer.childNodes[i];
            labelBox.childNodes[0].innerHTML = classPrediction;
            labelBox.childNodes[1].style.width = percentage + "%";
        }
    }
  </script>
</body>
</html>
